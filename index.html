<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6f5c">
<title>Мой день</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f5f4ef; --card:#ffffff; --ink:#1d2321; --mute:#6b7571; --line:#e3e1d9;
  --accent:#1f6f5c; --accent-ink:#fff; --gold:#c98a12; --danger:#b3412f;
  --radius:14px;
  --c-work:#3b6fb6; --c-family:#d9783a; --c-god:#8a5cc2; --c-sport:#2f9b62;
  --c-english:#c43f6a; --c-growth:#1f8f8f; --c-reading:#9a7b2f; --c-home:#7b8580;
  --c-rest:#a3a3a3; --c-sleep:#45526e;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1715; --card:#18221f; --ink:#e8ece9; --mute:#93a09b; --line:#26332f;
    --accent:#3fae8f; --accent-ink:#06120e; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:76px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;flex:1}
#syncDot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
#syncDot.ok{background:var(--c-sport)} #syncDot.err{background:var(--danger)} #syncDot.busy{background:var(--gold)}
main{max-width:720px;margin:0 auto;padding:12px 14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mute);font-size:11px;padding:4px 0;display:flex;
  flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button .i{font-size:21px;line-height:1}
nav button.on{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:13px}
button.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 14px;
  font-size:15px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;font-size:14px;cursor:pointer}
button.small{padding:5px 9px;font-size:13px}
button.danger{color:var(--danger)}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:9px 10px}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}
.block{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.block:last-child{border-bottom:0}
.block .bar{width:5px;align-self:stretch;border-radius:3px}
.block .time{width:92px;flex:none;font-variant-numeric:tabular-nums;font-size:14px;color:var(--mute)}
.block.now{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:10px;padding-left:6px;padding-right:6px}
.block.done .title{text-decoration:line-through;color:var(--mute)}
.block .title{font-weight:600}
.block .note{font-size:13px;color:var(--mute);white-space:pre-line;margin-top:3px}
.block .acts{display:flex;gap:6px;flex:none}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:none;font-size:16px;
  cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.chk.on{background:var(--c-sport);border-color:var(--c-sport);color:#fff}
.chk.skip{background:var(--line);color:var(--mute)}
.habits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.habit{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;
  cursor:pointer;user-select:none;font-size:14px;background:var(--bg)}
.habit.on{border-color:var(--c-sport);background:color-mix(in srgb,var(--c-sport) 14%,transparent)}
.habit .streak{margin-left:auto;font-size:12px;color:var(--gold);font-weight:700}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{border:0;border-radius:12px;padding:12px 6px;color:#fff;font-weight:600;font-size:14px;cursor:pointer;opacity:.9}
.cat.on{outline:3px solid var(--ink);opacity:1}
.timer{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.hbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.hbar .lbl{width:104px;flex:none}
.hbar .track{flex:1;height:14px;background:var(--line);border-radius:7px;overflow:hidden;position:relative}
.hbar .fill{height:100%;border-radius:7px}
.hbar .plan{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.hbar .val{width:96px;font-size:13px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;color:#fff}
.daytabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.daytabs button.on{background:var(--accent);color:var(--accent-ink)}
.hidden{display:none!important}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.dlg .sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;
  max-height:90vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.dlg{align-items:center}.dlg .sheet{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:20px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.weekgrid{display:grid;grid-template-columns:auto repeat(7,1fr);gap:3px;font-size:12px;align-items:center}
.weekgrid .c{height:22px;border-radius:5px;background:var(--line)}
.weekgrid .c.on{background:var(--c-sport)}
.weekgrid .h{text-align:center;color:var(--mute)}
.goal-step{display:flex;gap:8px;align-items:center;padding:4px 0}
.goal-step.done span{text-decoration:line-through;color:var(--mute)}
svg text{fill:var(--mute);font-size:11px}
</style>
</head>
<body>
<header>
  <h1 id="title">Сегодня</h1>
  <span class="mute" id="clock"></span>
  <span id="syncDot" title="Синхронизация"></span>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-v="today" class="on"><span class="i">☀️</span>Сегодня</button>
  <button data-v="time"><span class="i">⏱️</span>Время</button>
  <button data-v="goals"><span class="i">🎯</span>Цели</button>
  <button data-v="week"><span class="i">📊</span>Неделя</button>
  <button data-v="settings"><span class="i">⚙️</span>Ещё</button>
</nav>
<div id="dlg" class="dlg hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="app.js"></script>
</body>
</html>
